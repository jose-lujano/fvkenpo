{% extends 'base.html' %}{% block title %}Galería | FVK{% endblock %}{% block content %}<section class="max-w-7xl mx-auto px-5 py-16"><p class="text-sm uppercase tracking-widest text-blue-700 font-bold">Memoria visual</p><h1 class="text-4xl font-black mt-2">Galería de eventos</h1><div class="flex flex-wrap gap-2 mt-8"><a class="px-4 py-2 rounded-full border {% if not selected_album %}bg-slate-900 text-white{% endif %}" href="{% url 'galeria' %}">Todos</a>{% for album in albums %}<a class="px-4 py-2 rounded-full border {% if selected_album == album.id|stringformat:'i' %}bg-slate-900 text-white{% endif %}" href="?album={{ album.id }}">{{ album.titulo }}</a>{% endfor %}</div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-10">{% for item in imagenes %}<figure class="bg-white rounded-xl overflow-hidden shadow-sm"><img src="{{ item.imagen.url }}" class="w-full aspect-[4/3] object-cover" alt="{{ item.titulo }}"><figcaption class="p-4"><strong>{{ item.titulo }}</strong><p class="text-sm text-slate-500">{{ item.album.titulo }}</p></figcaption></figure>{empty}<p class="text-slate-500">No hay imágenes para este filtro.</p>{% endfor %}</div></section>{% endblock %}
